name: ChromaQR tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install libzbar (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libzbar0
      - name: Install project and tests
        run: python -m pip install --upgrade pip && python -m pip install -e ".[tests]"
      - name: Run tests
        run: python -m pytest -q

  package:
    name: Build and installed-wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y libzbar0
          python -m pip install --upgrade pip build twine packaging
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Verify packaged UI files
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          sdist = glob.glob("dist/*.tar.gz")[0]
          required = {
              "chromaqr/templates/base.html",
              "chromaqr/templates/demo.html",
              "chromaqr/templates/home.html",
              "chromaqr/templates/realtime.html",
              "chromaqr/static/logo.png",
          }
          with zipfile.ZipFile(wheel) as archive:
              assert required <= set(archive.namelist())
          with tarfile.open(sdist) as archive:
              names = {name.split("/", 1)[-1] for name in archive.getnames()}
              assert required <= names
          PY
      - name: Smoke test installed wheel (web, API, CLI)
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import base64, json, subprocess, tempfile
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          import chromaqr
          from chromaqr.server import app

          client = app.test_client()
          for route in ("/", "/demo", "/realtime", "/logo.png"):
              response = client.get(route)
              assert response.status_code == 200 and response.data
          response = client.post("/encode", data={
              "data": "wheel hidden", "compatibilityData": "wheel ordinary"
          })
          encoded = json.loads(response.data)["result"].split(",", 1)[1]
          image = Image.open(BytesIO(base64.b64decode(encoded)))
          assert chromaqr.Decoder().decode(image) == b"wheel hidden"

          with tempfile.TemporaryDirectory() as directory:
              output = Path(directory) / "cli.png"
              subprocess.run([
                  "chromaqr", "encode", "--text", "cli smoke",
                  "--compatibilityText", "ordinary", "--outFile", str(output)
              ], check=True)
              assert chromaqr.Decoder().decode(Image.open(output)) == b"cli smoke"
          PY
